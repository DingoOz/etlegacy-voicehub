# Bot personas. Keys are the clean Omni-bot names (without the [BOT] prefix).
# Any connected bot without an entry uses [default]. Set voiced = false on
# [default] to restrict speech to the named bots only.
#   voice   = Piper voice (engine = "piper")
#   speaker = Qwen3-TTS preset (engine = "qwen"): Ryan or Aiden are the English male presets
#   style   = Qwen3-TTS voice description, prepended to the emotion instruction
#   speed   = playback rate multiplier on top of [tts] speed (1.0 = unchanged)
#   volume  = gain applied to this bot's audio (1.0 = unchanged)
# This file is rewritten by the settings page (https://<hub>/settings); comments below are not kept.

[default]
voiced = true
voice = "en_US-lessac-medium"
speaker = "Ryan"
style = "A young man, late teens to early twenties, gamer at a LAN party."
persona = "a seasoned Enemy Territory soldier with a dry sense of humour; keeps radio chatter short and practical"

[bots.Walter]
voice = "en_GB-alan-medium"
speaker = "Aiden"
style = "A young man in his early twenties with a gruff, grumbling delivery."
persona = "gruff Yorkshire engineer, veteran of a hundred LAN parties, complains about everything but always builds the bridge"
speed = 1.0
volume = 1.0

